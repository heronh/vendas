<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novo produto · Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
</head>
<body class="min-h-screen bg-cream font-serif text-ink">
  <div class="banner"><a href="index.html">← mapa da sequência</a> · 04 / 10 · Novo produto</div>
  <div class="wrap">
    <header class="app-header">
      <div>
        <h1>Novo produto no servidor</h1>
        <p class="muted">Entra no catálogo compartilhado. Não cria venda nem altera saldo de cliente.</p>
      </div>
      <a href="03-produtos.html">Voltar à lista</a>
    </header>
    <nav class="tabs">
      <a href="02-inicio.html">Início</a>
      <a href="03-produtos.html" aria-current="page">Produtos</a>
      <a href="05-clientes.html">Clientes</a>
      <a href="07-relatorios.html">Relatórios</a>
      <a href="09-administracao.html">Administração</a>
    </nav>

    <div class="panel">
      <form class="grid-form" action="03-produtos.html" method="get">
        <div>
          <label class="field" for="description">Descrição</label>
          <input class="field-input" id="description" name="description" required />
        </div>
        <div>
          <label class="field" for="supplier">Fornecedor</label>
          <input class="field-input" id="supplier" name="supplier" />
        </div>
        <div>
          <label class="field" for="cost">Custo (R$)</label>
          <input class="field-input" id="cost" name="cost" inputmode="decimal" />
        </div>
        <div>
          <label class="field" for="sale">Venda (R$)</label>
          <input class="field-input" id="sale" name="sale" inputmode="decimal" />
        </div>
        <div>
          <label class="field" for="barcode">Código de barras</label>
          <input class="field-input" id="barcode" name="barcode" />
        </div>
        <div>
          <button class="btn" type="submit">Salvar no catálogo</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
