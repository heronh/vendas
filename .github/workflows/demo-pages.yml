name: Demo web

on:
  push:
    branches: [demo-web]
    paths:
      - "android/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-web-static
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - name: Build web demo
        working-directory: android
        env:
          VITE_DEMO: "true"
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Copy the site to the branch root
        run: |
          rm -rf assets
          mkdir -p assets
          cp android/dist/index.html android/dist/404.html android/dist/logo.jpeg android/dist/manifest.webmanifest .
          cp -R android/dist/assets/. assets/
          touch .nojekyll
      - name: Commit the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html 404.html logo.jpeg manifest.webmanifest assets
          if git diff --cached --quiet; then
            echo "Site already matches this build."
          else
            git commit -m "Publica a demonstração no GitHub Pages."
            git push
          fi
